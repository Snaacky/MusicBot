name: Python container image

on:
  push:
    branches: [python-version]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "LICENSE"
      - ".github/workflows/python-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: python-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/python-version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Select branch image tag
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:python-version" >> "$GITHUB_ENV"
      - name: Build Python image
        run: >-
          docker build --pull --tag "$IMAGE"
          --build-arg "BUILD_REVISION=${GITHUB_SHA}"
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --label "org.opencontainers.image.licenses=MIT" .
      - name: Check container dependencies
        run: docker run --rm --network none "$IMAGE" --check
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish branch image
        run: docker push "$IMAGE"

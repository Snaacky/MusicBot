[project]
name = "dj-khaled"
version = "1.7.1"
description = "DJ Khaled — a Discord music bot with native yt-dlp integration"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.12,<4",
    "beautifulsoup4>=4.13,<5",
    "discord.py[speed,voice]>=2.7.1,<3",
    # discord.py 2.7.1 uses the pre-0.2 DAVE transition API.
    # Remove this cap after https://github.com/Rapptz/discord.py/pull/10548 ships.
    "davey>=0.1.7,<0.2",
    "python-dotenv>=1.1,<2",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
dj-khaled = "dj_khaled.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["*.[mM][dD]"]

[tool.hatch.build.targets.wheel]
packages = ["src/dj_khaled"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/.env.example",
    "/.python-version",
    "/.gitignore",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
